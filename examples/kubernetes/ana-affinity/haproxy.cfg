defaults
    timeout connect 5s
    timeout client 2m
    timeout server 2m

frontend http
    bind :8000
    mode http
    acl workflow path /tools/call /tools/call/ /sessions/current /sessions/current/
    acl session_header req.fhdr_cnt(X-ANA-Session) gt 0
    acl multiple_session_headers req.fhdr_cnt(X-ANA-Session) gt 1
    acl replica_0 req.fhdr(X-ANA-Session) -m beg grapharrow-0.
    acl replica_1 req.fhdr(X-ANA-Session) -m beg grapharrow-1.
    http-request return status 404 content-type application/json string '{"detail":"Unknown or expired session"}' hdr Cache-Control no-store if workflow multiple_session_headers
    http-request return status 404 content-type application/json string '{"detail":"Unknown or expired session"}' hdr Cache-Control no-store if workflow session_header !replica_0 !replica_1
    use_backend http_0 if workflow replica_0
    use_backend http_1 if workflow replica_1
    default_backend http_pool

backend http_pool
    mode http
    balance roundrobin
    option httpchk GET /health
    retries 0
    server grapharrow_0 grapharrow-0:8000 check
    server grapharrow_1 grapharrow-1:8000 check

backend http_0
    mode http
    option httpchk GET /health
    retries 0
    server grapharrow_0 grapharrow-0:8000 check

backend http_1
    mode http
    option httpchk GET /health
    retries 0
    server grapharrow_1 grapharrow-1:8000 check

listen bolt
    bind :7687
    mode tcp
    timeout client 1h
    timeout server 1h
    balance roundrobin
    server grapharrow_0 grapharrow-0:7687 check
    server grapharrow_1 grapharrow-1:7687 check
