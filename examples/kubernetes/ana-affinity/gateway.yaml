apiVersion: v1
kind: Service
metadata:
  name: grapharrow-gateway
spec:
  selector:
    app: grapharrow-gateway
  ports:
    - name: http
      port: 8000
    - name: bolt
      port: 7687
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grapharrow-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grapharrow-gateway
  template:
    metadata:
      labels:
        app: grapharrow-gateway
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          ports:
            - name: http
              containerPort: 8000
            - name: bolt
              containerPort: 7687
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: grapharrow-gateway-config
