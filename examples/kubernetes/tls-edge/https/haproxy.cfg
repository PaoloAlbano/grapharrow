global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-load-extra-files key

defaults
    log global
    timeout connect 5s
    timeout client 2m
    timeout server 2m
    retries 0

listen https
    mode http
    bind :8443 ssl crt /etc/grapharrow/tls/tls.crt alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    server grapharrow grapharrow:8000
