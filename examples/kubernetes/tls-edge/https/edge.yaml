apiVersion: apps/v1
kind: Deployment
metadata:
  name: grapharrow-tls-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: grapharrow-tls-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grapharrow-tls-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grapharrow-tls-edge
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine@sha256:7816a9801a6846b912bc37e48529808e2fa87c3c47992441940f68e393ebcfeb
          args: ["-W", "-db", "-f", "/usr/local/etc/haproxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: https
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: tls
              mountPath: /etc/grapharrow/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: grapharrow-tls-edge
        - name: tls
          secret:
            secretName: grapharrow-edge-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.crt.key
---
apiVersion: v1
kind: Service
metadata:
  name: grapharrow-https
spec:
  selector:
    app.kubernetes.io/name: grapharrow-tls-edge
  ports:
    - name: https
      port: 443
      targetPort: https
