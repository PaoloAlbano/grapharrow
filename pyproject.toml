[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "grapharrow"
version = "0.1.0"
description = "An embedded property graph database built on PyArrow and Parquet."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "GraphArrow contributors" },
]
dependencies = [
  "antlr4-python3-runtime>=4.13.2",
  "fastapi>=0.135.2",
  "orjson>=3.11.9",
  "pandas>=3.0.2",
  "pyarrow>=20.0.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "uvicorn>=0.42.0",
]

[project.scripts]
grapharrow = "grapharrow.interfaces.cli:main"
grapharrow-server = "grapharrow.server:main"
grapharrow-bolt = "grapharrow.interfaces.bolt:main"

[dependency-groups]
benchmark = [
  "duckdb",
  "polars",
]
dev = [
  "antlr4-tools>=0.2.2",
  "httpx>=0.28.1",
  "mypy>=1.15.0",
  "moto[server]>=5.1.0",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "neo4j>=6.1.0",
  "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grapharrow"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/vendor", "/docs", "/pyproject.toml", "/uv.lock",
  "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CONTRIBUTING.md",
  "/Makefile", "/Dockerfile", "/Dockerfile.dev", "/.dockerignore",
  "/scripts/benchmark_backends.py", "/scripts/benchmark_bolt_engines.py",
  "/scripts/benchmark_cypher_engine.py", "/scripts/benchmark_tabular_json.py",
  "/scripts/benchmark_ana_sessions.py",
  "/scripts/benchmark_ana_traversals.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "integration: marks integration tests that may require additional services or slower setup",
  "live_storage: marks integration tests that target real cloud object storage accounts",
  "neo4j_reference: compares ANA over HTTP against an explicitly configured disposable reference service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/grapharrow/interfaces/opencypher/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_unused_ignores = true
strict = true
exclude = "^src/grapharrow/interfaces/opencypher/generated/"

[tool.coverage.run]
omit = ["src/grapharrow/interfaces/opencypher/generated/*"]

[tool.coverage.report]
omit = ["src/grapharrow/interfaces/opencypher/generated/*"]

[[tool.mypy.overrides]]
module = ["antlr4", "antlr4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grapharrow.interfaces.opencypher.generated.*"]
ignore_errors = true
