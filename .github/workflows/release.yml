name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: '55 23 * * 1'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Select release commit and version
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
       !github.event.repository.fork) ||
      (github.event_name == 'push' && github.event.created && !github.event.deleted &&
       github.actor_id == github.repository_owner_id &&
       github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate the manual tag or select a nightly build
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python .github/release_metadata.py --nightly --output "$GITHUB_OUTPUT"
            if ! grep -q '^tag=' "$GITHUB_OUTPUT"; then
              echo 'This commit is already covered by a published release.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            python .github/release_metadata.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
          fi

  checks:
    name: Release validation
    needs: metadata
    if: needs.metadata.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release-build: true
      build-version: ${{ needs.metadata.outputs.version }}

  publish:
    name: Publish tested artifacts
    needs: [metadata, checks]
    if: github.event_name == 'schedule' || github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-*
          merge-multiple: true
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the verified wheel, sources and multi-platform image
        run: python .github/publish_release.py
