name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-build:
        description: Preserve tested container images for the release workflow.
        type: boolean
        default: false
      build-version:
        description: Set the package version in the release build checkout.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release-build && 'release' || 'check' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release-build }}

env:
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Lint
        if: matrix.check == 'lint'
        run: uv run --frozen ruff check .
      - name: Validate GitHub Actions workflows
        if: matrix.check == 'lint'
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Format
        if: matrix.check == 'format'
        run: uv run --frozen ruff format --check .
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: uv run --frozen mypy src

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11","3.15"]' || '["3.11","3.12","3.13","3.14","3.15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Test local backends and interfaces
        run: uv run --frozen pytest -m "not live_storage and not neo4j_reference"

  distributions:
    name: Build wheel and source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Build once from the source distribution
        env:
          BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          uv lock --check
          if [ -n "$BUILD_VERSION" ]; then
            python .github/release_metadata.py --build-version "$BUILD_VERSION"
          fi
          uv build --no-sources --out-dir dist
          uv export --locked --no-dev --no-emit-project --output-file dist/runtime-requirements.txt
          version="${BUILD_VERSION:-$(python .github/release_metadata.py --version)}"
          python .github/check_distribution.py dist --archives-only --expected-version "$version"
          python .github/release_metadata.py --checksums dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Installed wheel / Python ${{ matrix.python-version }}
    needs: distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11","3.15"]' || '["3.11","3.12","3.13","3.14","3.15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Install and exercise the built wheel outside the checkout
        run: python .github/check_distribution.py dist

  docker:
    name: Docker / ${{ matrix.arch }}
    needs: distributions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime from the verified wheel
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          version="${BUILD_VERSION:-$(python .github/release_metadata.py --version)}"
          docker buildx build --load --platform "linux/$ARCH" \
            --build-arg DISTRIBUTION_SOURCE=prebuilt \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --cache-from "type=gha,scope=runtime-$ARCH" \
            --cache-to "type=gha,mode=max,scope=runtime-$ARCH" \
            --tag "grapharrow:check-$ARCH" .
      - name: Check auth, sessions, persistence and Bolt in the container
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          version="${BUILD_VERSION:-$(python .github/release_metadata.py --version)}"
          uv run --frozen python .github/smoke_docker.py "grapharrow:check-$ARCH" \
            --expected-version "$version"
      - name: Preserve the tested image for publication
        if: inputs.release-build
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "grapharrow:check-$ARCH" | gzip > "image-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-build
        with:
          name: docker-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  ana-reference:
    name: ANA and Cypher reference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      neo4j:
        image: neo4j:2026.05.0
        env:
          NEO4J_AUTH: neo4j/grapharrow-reference-ci
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p grapharrow-reference-ci 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Start the ANA reference HTTP service
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          auth="$(mktemp "$RUNNER_TEMP/ana-clients.XXXXXX")"
          printf '{"clients":[{"id":"grapharrow-ci","api_key":"%s"}]}' "$key" > "$auth"
          chmod 644 "$auth"
          docker run -d --name grapharrow-ana-reference --network host \
            -e NEO4J_URI=bolt://127.0.0.1:7687 \
            -e NEO4J_USER=neo4j \
            -e NEO4J_PASSWORD=grapharrow-reference-ci \
            -e NEO4J_DATABASE=neo4j \
            -e ANA_NEO4J_IDENTITY_MODE=transaction \
            -e ANA_AUTH_FILE=/run/ana/clients.json \
            -v "$auth:/run/ana/clients.json:ro" \
            ghcr.io/paoloalbano/agent-native-graph@sha256:d2b04b3a1c9d0e923c764f12f37ce6467d4b6b0566e5375a26c0553efe44ca73
          printf 'GRAPHARROW_TEST_ANA_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health
      - name: Compare ANA workflows and Cypher semantics
        env:
          GRAPHARROW_TEST_NEO4J_URI: bolt://localhost:7687
          GRAPHARROW_TEST_NEO4J_PASSWORD: grapharrow-reference-ci
          GRAPHARROW_TEST_ANA_URL: http://127.0.0.1:8080
        run: uv run --frozen pytest -m neo4j_reference
      - name: Stop the reference service
        if: always()
        run: docker rm -f grapharrow-ana-reference

  required:
    name: CI required
    if: always()
    needs: [quality, tests, distributions, wheel-smoke, docker, ana-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          PYTHON
